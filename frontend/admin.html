
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickByte | Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            padding: 22px 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 10px #0000000a;
        }

        .brand {
            margin: 0;
            color: #087f5b;
            font-size: 28px;
        }

        .topbar p {
            margin-bottom: 0;
            color: #666;
        }

        .card {
            margin-top: 22px;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 10px #0000000a;
        }

        h2 {
            margin-top: 0;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 18px 0;
        }

        button {
            padding: 12px 17px;
            border: none;
            border-radius: 8px;
            background: #087f5b;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #066849;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .secondary {
            background: #495057;
        }

        .secondary:hover {
            background: #343a40;
        }

        .logout {
            background: #b42318;
        }

        .logout:hover {
            background: #8f1d14;
        }

        .order-card {
            margin-top: 15px;
            padding: 18px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            background: #fff;
        }

        .order-card h3 {
            margin-top: 0;
            color: #087f5b;
        }

        .order-card p {
            margin: 8px 0;
            color: #444;
        }

        .empty-state {
            padding: 25px 10px;
            text-align: center;
            color: #777;
            background: #f8fafc;
            border-radius: 8px;
        }

        .footer {
            padding: 22px;
            text-align: center;
            color: #888;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            body {
                padding: 14px;
            }

            .topbar,
            .card {
                padding: 18px;
            }

            .brand {
                font-size: 24px;
            }

            .actions button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header class="topbar">
            <div>
                <h1 class="brand">🍔 QuickByte</h1>
                <p>Admin Control Panel</p>
            </div>

            <div>
                <strong>👨‍💼 Welcome, <span id="adminName"></span></strong>
            </div>
        </header>

        <section class="card">

            <h2>📦 Order Management</h2>
            <p>View pending orders and process the next order in the queue.</p>

            <div class="actions">
                <button onclick="loadOrders()">
                    🔄 Refresh Orders
                </button>

                <button onclick="processNextOrder()">
                    🚚 Process Next Order
                </button>
            </div>

            <div id="orders">
                <div class="empty-state">
                    Click Refresh Orders to see orders.
                </div>
            </div>

        </section>

        <section class="card">
            <h2>⚙️ Admin Account</h2>
            <p>Currently logged in as <strong id="adminUsername"></strong>.</p>

            <button class="logout" onclick="logout()">
                🚪 Logout
            </button>
        </section>

        <footer class="footer">
            QuickByte Food Delivery System
        </footer>

    </div>

    <script>
        const role = localStorage.getItem("role");
        const username = localStorage.getItem("username");

        if (role !== "admin") {
            window.location.href = "login.html";
        }

        document.getElementById("adminName").innerText = username || "Admin";
        document.getElementById("adminUsername").innerText = username || "Admin";

        // LOAD ORDERS
        async function loadOrders() {
            const ordersContainer = document.getElementById("orders");

            try {
                const response = await fetch("http://localhost:8000/api/orders");

                if (!response.ok) {
                    throw new Error("Unable to fetch orders");
                }

                const data = await response.json();
                const orders = data.orders || [];

                let html = "<h3>📦 Pending Orders</h3>";

                if (orders.length === 0) {
                    html += `
                        <div class="empty-state">
                            No pending orders.
                        </div>
                    `;
                } else {
                    for (const order of orders) {
                        html += `
                            <div class="order-card">
                                <h3>Order #${order.orderId}</h3>
                                <p><strong>Total:</strong> ₹${order.total}</p>
                            </div>
                        `;
                    }
                }

                ordersContainer.innerHTML = html;

            } catch (error) {
                console.error(error);

                ordersContainer.innerHTML = `
                    <div class="empty-state">
                        Unable to load orders. Please check the backend.
                    </div>
                `;
            }
        }

        // PROCESS NEXT ORDER
        async function processNextOrder() {
            try {
                const response = await fetch(
                    "http://localhost:8000/api/orders/process",
                    {
                        method: "POST"
                    }
                );

                const data = await response.json();

                alert(data.message || "Order processing request completed.");

                await loadOrders();

            } catch (error) {
                console.error(error);
                alert("Unable to process order. Check the backend.");
            }
        }

        // LOGOUT
        function logout() {
            localStorage.clear();
            window.location.href = "login.html";
        }
    </script>

</body>
</html>
